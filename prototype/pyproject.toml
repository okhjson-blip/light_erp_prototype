[project]
name = "light-erp-prototype"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "sqlalchemy==2.0.51",
  "psycopg2-binary==2.9.12",
  "httpx==0.27.2",
  "alembic==1.13.2",
  "PyJWT[crypto]==2.9.0",
  "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build"
